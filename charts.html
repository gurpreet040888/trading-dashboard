<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Market Trend Explorer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f7f8fa;
    margin:0;
    padding:20px;
    color:#2b2f38;
}

h1{
    margin-top:0;
}

.site-nav{
    display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
    padding:10px 14px; margin:-20px -20px 20px;
    background:#ffffff; border-bottom:1px solid #e3e6eb;
}
.site-nav a{
    font-size:12px; padding:6px 12px; border-radius:20px;
    color:#4b5568; text-decoration:none; background:#f1f3f6; border:1px solid transparent;
}
.site-nav a:hover{ background:#e8ebf0; color:#2b2f38; }
.site-nav a.active{ background:#dbe7fa; color:#2b5a9e; border-color:#c3d8f5; }

.container{
    display:grid;
    grid-template-columns:70% 30%;
    gap:20px;
}

.card{
    background:white;
    border:1px solid #e3e6eb;
    border-radius:12px;
    padding:15px;
    box-shadow:0 1px 4px rgba(20,20,30,.04);
}

#selectorCard{
    position:sticky;
    top:10px;
    max-height:80vh;
    overflow:auto;
}

button{
    padding:8px 14px;
    border:1px solid #d7dbe2;
    background:white;
    cursor:pointer;
    border-radius:6px;
    margin-right:5px;
    color:#2b2f38;
}

button:hover{
    background:#f1f3f6;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #d7dbe2;
    border-radius:6px;
    margin-bottom:10px;
    box-sizing:border-box;
}

.select-row{
    display:flex;
    gap:6px;
    margin-bottom:10px;
}

.select-row button{
    flex:1;
    padding:6px 8px;
    font-size:12px;
    margin-right:0;
}

.stock-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px 10px;
}

.stock-item{
    padding:2px 0;
    font-size:11.5px;
    line-height:1.5;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.stock-item label{
    display:flex;
    align-items:center;
    gap:5px;
    cursor:pointer;
}

.stock-item input[type="checkbox"]{
    width:12px;
    height:12px;
    margin:0;
    flex:none;
}

.selected-count{
    font-size:11px;
    color:#6b7280;
    margin-bottom:8px;
}

.cards{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:15px;
}

.stock-card{
    background:white;
    border:1px solid #e3e6eb;
    border-radius:12px;
    padding:10px;
}

.stock-card canvas{
    height:130px !important;
}

.mode-active{
    background:#3b6ea5;
    color:white;
    border-color:#3b6ea5;
}

.range-active{
    background:#eef1f5;
    border-color:#b9c2cf;
    font-weight:bold;
}

</style>
</head>

<body>

<nav class="site-nav">
  <a href="index.html">Dashboard</a>
  <a href="ai.html">AI insights</a>
  <a href="funds.html">Mutual funds</a>
  <a href="charts.html" class="active">Charts</a>
  <a href="news.html">News radar</a>
  <a href="dependency-map.html">Dependency map</a>
</nav>

<h1>📈 Market Trend Explorer</h1>

<div style="margin-bottom:15px;" id="rangeButtons">

<button data-range="1mo" onclick="setRange('1mo')">1M</button>
<button data-range="3mo" onclick="setRange('3mo')">3M</button>
<button data-range="6mo" onclick="setRange('6mo')">6M</button>
<button data-range="1y" onclick="setRange('1y')">1Y</button>
<button data-range="2y" class="range-active" onclick="setRange('2y')">2Y</button>
<button data-range="3y" onclick="setRange('3y')">3Y</button>

&nbsp;&nbsp;&nbsp;

<button id="normBtn"
        class="mode-active"
        onclick="setMode('normalized')">
Normalized
</button>

<button id="rawBtn"
        onclick="setMode('raw')">
Raw Price
</button>

</div>

<div class="container">

<div class="card">

<canvas id="mainChart" height="130"></canvas>

</div>

<div class="card" id="selectorCard">

<input
 id="searchBox"
 placeholder="Search stocks..."
 onkeyup="filterStocks()">

<div class="select-row">
<button onclick="selectAll()">Select all</button>
<button onclick="selectNone()">Select none</button>
</div>

<div class="selected-count" id="selectedCount"></div>

<div id="stockList" class="stock-list"></div>

</div>

</div>

<h2 style="margin-top:40px;">
All Stock Trends
</h2>

<div id="cards" class="cards"></div>

<script>

let stockData={};
let selected=[];
let range="2y";
let mode="normalized";
let mainChart;
let miniCharts={};

fetch("historical_prices.json")
.then(r=>r.json())
.then(data=>{

    stockData=data;

    buildStockList();
    buildMiniCards();

});

function buildStockList(){

    let html="";

    Object.keys(stockData)
    .sort()
    .forEach(ticker=>{

        html += `
        <div class="stock-item">
        <label>
        <input
            type="checkbox"
            value="${ticker}"
            onchange="toggleStock(this)">
        ${ticker}
        </label>
        </div>
        `;
    });

    stockList.innerHTML=html;
    updateSelectedCount();
}

function updateSelectedCount(){
    document.getElementById("selectedCount").innerText =
      selected.length + " of " + Object.keys(stockData).length + " selected";
}

function filterStocks(){

    let text=
    document
    .getElementById("searchBox")
    .value
    .toLowerCase();

    document
    .querySelectorAll(".stock-item")
    .forEach(item=>{

        item.style.display=
        item.innerText
        .toLowerCase()
        .includes(text)
        ? ""
        : "none";
    });
}

function selectAll(){

    document.querySelectorAll("#stockList input[type='checkbox']")
    .forEach(cb=>{
        cb.checked = true;
        if(!selected.includes(cb.value)) selected.push(cb.value);
    });

    updateSelectedCount();
    renderMainChart();
}

function selectNone(){

    document.querySelectorAll("#stockList input[type='checkbox']")
    .forEach(cb=> cb.checked = false);

    selected = [];

    updateSelectedCount();
    renderMainChart();
}

function toggleStock(cb){

    if(cb.checked){

        selected.push(cb.value);

    }else{

        selected=
        selected.filter(
          x=>x!==cb.value
        );
    }

    updateSelectedCount();
    renderMainChart();
}

function setRange(r){

    range=r;

    document.querySelectorAll("#rangeButtons button[data-range]")
    .forEach(b=> b.classList.toggle("range-active", b.dataset.range===r));

    renderMainChart();
    drawMiniCharts();
}

function setMode(m){

    mode=m;

    normBtn.classList.remove("mode-active");
    rawBtn.classList.remove("mode-active");

    if(m==="normalized")
        normBtn.classList.add("mode-active");
    else
        rawBtn.classList.add("mode-active");

    renderMainChart();
}

function getLength(){

    switch(range){

        case "1mo": return 22;
        case "3mo": return 66;
        case "6mo": return 132;
        case "1y": return 252;
        case "2y": return 504;
        case "3y": return 756;
    }

    return 504;
}

function rangeLabel(){
    switch(range){
        case "1mo": return "1M";
        case "3mo": return "3M";
        case "6mo": return "6M";
        case "1y": return "1Y";
        case "2y": return "2Y";
        case "3y": return "3Y";
    }
    return range;
}

function renderMainChart(){

    const datasets=[];

    let labels=[];

    selected.forEach(ticker=>{

        const stock=
        stockData[ticker];

        if(!stock) return;

        let prices=
        stock.prices.slice(
            -getLength()
        );

        let dates=
        stock.dates.slice(
            -getLength()
        );

        labels=dates;

        if(mode==="normalized"){

            const base=
            prices[0];

            prices=
            prices.map(
                p=>(
                    ((p/base)-1)*100
                ).toFixed(2)
            );
        }

        datasets.push({

            label:ticker,
            data:prices,
            borderWidth:2,
            pointRadius:0,
            tension:.1

        });

    });

    if(mainChart)
        mainChart.destroy();

    mainChart=
    new Chart(
      document.getElementById("mainChart"),
      {

        type:"line",

        data:{
            labels,
            datasets
        },

        options:{

            responsive:true,

            interaction:{
                mode:'index',
                intersect:false
            },

            plugins:{
                legend:{
                    position:'top'
                }
            },

            scales:{
                x:{
                    ticks:{ maxTicksLimit:8, font:{size:10} },
                    title:{ display:true, text:"Date", font:{size:11} }
                },
                y:{
                    ticks:{ font:{size:10} },
                    title:{
                        display:true,
                        text: mode==="normalized" ? "Change since start (%)" : "Price",
                        font:{size:11}
                    }
                }
            }
        }
    });
}

function buildMiniCards(){

    let html="";

    Object.keys(stockData)
    .sort()
    .forEach(ticker=>{

        html += `

        <div class="stock-card">

            <b>${ticker}</b>

            <canvas
                id="mini_${ticker.replace(/\./g,'_')}">
            </canvas>

        </div>

        `;
    });

    cards.innerHTML=html;

    setTimeout(drawMiniCharts,300);
}

function drawMiniCharts(){

    Object.keys(stockData)
    .forEach(ticker=>{

        const stock=
        stockData[ticker];

        const canvasId = "mini_"+ticker.replace(/\./g,'_');

        const canvas=
        document.getElementById(canvasId);

        if(!canvas) return;

        const prices = stock.prices.slice(-getLength());
        const dates = (stock.dates || []).slice(-getLength());

        if(miniCharts[canvasId]){
            miniCharts[canvasId].destroy();
        }

        miniCharts[canvasId] = new Chart(canvas,{

            type:"line",

            data:{

                labels: dates.length ? dates : prices.map((_,i)=>i),

                datasets:[{

                    data:prices,

                    pointRadius:0,

                    borderWidth:1.5,

                    borderColor:"#3b6ea5"
                }]
            },

            options:{

                responsive:true,

                plugins:{
                    legend:false,
                    title:{
                        display:true,
                        text:rangeLabel(),
                        font:{size:9},
                        color:"#6b7280",
                        padding:{bottom:2}
                    }
                },

                scales:{
                    x:{
                        display:true,
                        ticks:{
                            maxTicksLimit:3,
                            font:{size:8},
                            color:"#6b7280",
                            maxRotation:0
                        },
                        grid:{ display:false }
                    },
                    y:{
                        display:true,
                        ticks:{
                            maxTicksLimit:3,
                            font:{size:8},
                            color:"#6b7280"
                        },
                        grid:{ color:"#eef1f5" }
                    }
                }
            }
        });

    });
}

</script>

</body>
</html>
