<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Market Trend Explorer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    margin:0;
    padding:20px;
    color:#334155;
}

h1{
    margin-top:0;
}

.container{
    display:grid;
    grid-template-columns:70% 30%;
    gap:20px;
}

.card{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:15px;
    box-shadow:0 1px 4px rgba(0,0,0,.05);
}

#selectorCard{
    position:sticky;
    top:10px;
    max-height:80vh;
    overflow:auto;
}

button{
    padding:8px 14px;
    border:1px solid #cbd5e1;
    background:white;
    cursor:pointer;
    border-radius:6px;
    margin-right:5px;
}

button:hover{
    background:#f1f5f9;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #cbd5e1;
    border-radius:6px;
    margin-bottom:15px;
}

.stock-item{
    padding:4px 0;
}

.cards{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.stock-card{
    background:white;
    border:1px solid #e2e8f0;
    border-radius:12px;
    padding:10px;
}

.stock-card canvas{
    height:120px !important;
}

.mode-active{
    background:#2563eb;
    color:white;
}

</style>
</head>

<body>

<h1>📈 Market Trend Explorer</h1>

<div style="margin-bottom:15px;">

<button onclick="setRange('1mo')">1M</button>
<button onclick="setRange('3mo')">3M</button>
<button onclick="setRange('6mo')">6M</button>
<button onclick="setRange('1y')">1Y</button>
<button onclick="setRange('2y')">2Y</button>
<button onclick="setRange('3y')">3Y</button>

&nbsp;&nbsp;&nbsp;

<button id="normBtn"
        class="mode-active"
        onclick="setMode('normalized')">
Normalized
</button>

<button id="rawBtn"
        onclick="setMode('raw')">
Raw Price
</button>

</div>

<div class="container">

<div class="card">

<canvas id="mainChart" height="130"></canvas>

</div>

<div class="card" id="selectorCard">

<input
 id="searchBox"
 placeholder="Search stocks..."
 onkeyup="filterStocks()">

<div id="stockList"></div>

</div>

</div>

<h2 style="margin-top:40px;">
All Stock Trends
</h2>

<div id="cards" class="cards"></div>

<script>

let stockData={};
let selected=[];
let range="2y";
let mode="normalized";
let mainChart;

fetch("historical_prices.json")
.then(r=>r.json())
.then(data=>{

    stockData=data;

    buildStockList();
    buildMiniCards();

});

function buildStockList(){

    let html="";

    Object.keys(stockData)
    .sort()
    .forEach(ticker=>{

        html += `
        <div class="stock-item">

        <label>

        <input
            type="checkbox"
            value="${ticker}"
            onchange="toggleStock(this)">

        ${ticker}

        </label>

        </div>
        `;
    });

    stockList.innerHTML=html;
}

function filterStocks(){

    let text=
    document
    .getElementById("searchBox")
    .value
    .toLowerCase();

    document
    .querySelectorAll(".stock-item")
    .forEach(item=>{

        item.style.display=
        item.innerText
        .toLowerCase()
        .includes(text)
        ? ""
        : "none";
    });
}

function toggleStock(cb){

    if(cb.checked){

        selected.push(cb.value);

    }else{

        selected=
        selected.filter(
          x=>x!==cb.value
        );
    }

    renderMainChart();
}

function setRange(r){

    range=r;

    renderMainChart();
}

function setMode(m){

    mode=m;

    normBtn.classList.remove("mode-active");
    rawBtn.classList.remove("mode-active");

    if(m==="normalized")
        normBtn.classList.add("mode-active");
    else
        rawBtn.classList.add("mode-active");

    renderMainChart();
}

function getLength(){

    switch(range){

        case "1mo": return 22;
        case "3mo": return 66;
        case "6mo": return 132;
        case "1y": return 252;
        case "2y": return 504;
        case "3y": return 756;
    }

    return 504;
}

function renderMainChart(){

    const datasets=[];

    let labels=[];

    selected.forEach(ticker=>{

        const stock=
        stockData[ticker];

        if(!stock) return;

        let prices=
        stock.prices.slice(
            -getLength()
        );

        let dates=
        stock.dates.slice(
            -getLength()
        );

        labels=dates;

        if(mode==="normalized"){

            const base=
            prices[0];

            prices=
            prices.map(
                p=>(
                    ((p/base)-1)*100
                ).toFixed(2)
            );
        }

        datasets.push({

            label:ticker,
            data:prices,
            borderWidth:2,
            pointRadius:0,
            tension:.1

        });

    });

    if(mainChart)
        mainChart.destroy();

    mainChart=
    new Chart(
      document.getElementById("mainChart"),
      {

        type:"line",

        data:{
            labels,
            datasets
        },

        options:{

            responsive:true,

            interaction:{
                mode:'index',
                intersect:false
            },

            plugins:{
                legend:{
                    position:'top'
                }
            }
        }
    });
}

function buildMiniCards(){

    let html="";

    Object.keys(stockData)
    .sort()
    .forEach(ticker=>{

        html += `

        <div class="stock-card">

            <b>${ticker}</b>

            <canvas
                id="mini_${ticker.replace(/\./g,'_')}">
            </canvas>

        </div>

        `;
    });

    cards.innerHTML=html;

    setTimeout(drawMiniCharts,300);
}

function drawMiniCharts(){

    Object.keys(stockData)
    .forEach(ticker=>{

        const stock=
        stockData[ticker];

        const canvas=
        document.getElementById(
          "mini_"+
          ticker.replace(/\./g,'_')
        );

        if(!canvas) return;

        new Chart(canvas,{

            type:"line",

            data:{

                labels:
                stock.prices.map((_,i)=>i),

                datasets:[{

                    data:stock.prices,

                    pointRadius:0,

                    borderWidth:1.5
                }]
            },

            options:{

                responsive:true,

                plugins:{
                    legend:false
                },

                scales:{
                    x:{display:false},
                    y:{display:false}
                }
            }
        });

    });
}

</script>

</body>
</html>
