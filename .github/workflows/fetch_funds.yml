name: Fetch Indian MF Data

on:
  schedule:
    - cron: '30 13 * * 1-5'   # 7:00 PM IST (13:30 UTC), Mon-Fri
  workflow_dispatch:

# Shared group with other workflows — prevents concurrent git pushes
concurrency:
  group: trading-dashboard-updates
  cancel-in-progress: false

jobs:
  fetch-funds:
    runs-on: ubuntu-latest
    timeout-minutes: 30        # ~10 min run + buffer for push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run incremental data pipeline
        run: python backend/fetch_funds.py

      - name: Commit and push funds.csv + funds.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funds.csv funds.json
          if git diff --staged --quiet; then
            echo "No changes — skipping push."
            exit 0
          fi
          git commit -m "chore: incremental MF update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin main