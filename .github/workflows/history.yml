name: Generate Historical Prices

on:

workflow_dispatch:

schedule:
- cron: '30 18 * * *'

permissions:
contents: write

jobs:

update:

runs-on: ubuntu-latest

steps:

  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - run: |
      pip install yfinance pandas

  - run: |
      python backend/generate_history.py

  - run: |

      git config --global user.name "github-actions"
      git config --global user.email "actions@github.com"

      git add historical_prices.json

      git commit -m "Update historical prices" || echo "No changes"

      git push