name: Generate Historical Prices

"on":
  workflow_dispatch:

  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: write

concurrency:
  group: trading-dashboard-updates
  cancel-in-progress: false

jobs:
  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Generate historical data
        run: |
          python backend/generate_history.py

      - name: Verify generated file
        run: |
          ls -lh historical_prices.json
          head -20 historical_prices.json || true

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add historical_prices.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update historical prices"

          git pull --rebase origin main || true

          git push origin HEAD:main