<!DOCTYPE html>
<html>
<head>
  <title>AI Trading Insights</title>

  <style>
    body {
      font-family: Arial;
      background: #f7f8fa;
      color: #2b2f38;
      padding: 20px;
    }

    h2 {
      text-align: center;
    }

    .site-nav{
      display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
      padding:10px 14px; margin:-20px -20px 20px;
      background:#ffffff; border-bottom:1px solid #e3e6eb;
    }
    .site-nav a{
      font-size:12px; padding:6px 12px; border-radius:20px;
      color:#4b5568; text-decoration:none; background:#f1f3f6; border:1px solid transparent;
    }
    .site-nav a:hover{ background:#e8ebf0; color:#2b2f38; }
    .site-nav a.active{ background:#dbe7fa; color:#2b5a9e; border-color:#c3d8f5; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #ffffff;
      border: 1px solid #e3e6eb;
      border-radius: 8px;
      overflow: hidden;
    }

    th {
      background: #eef1f5;
      padding: 10px;
    }

    td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #e9ebf0;
    }

    .buy { color: #1f8a54; font-weight: bold; }
    .sell { color: #c2453f; font-weight: bold; }
    .hold { color: #b3781f; }

  
</style>
</head>

<body>

<nav class="site-nav">
  <a href="index.html">Dashboard</a>
  <a href="ai.html" class="active">AI insights</a>
  <a href="funds.html">Mutual funds</a>
  <a href="charts.html">Charts</a>
  <a href="news.html">News radar</a>
  <a href="dependency-map.html">Dependency map</a>
<a href="calculators.html">Calculators</a>
</nav>


<h2>🧠 AI Trading Insights</h2>

<h3>🟢 Top BUY Opportunities</h3>
<table>
  <thead>
    <tr>
      <th>Ticker</th>
      <th>Score</th>
      <th>RSI</th>
      <th>Reasons</th>
    </tr>
  </thead>
  <tbody id="buyTable"></tbody>
</table>

<h3>🔴 Top SELL Opportunities</h3>
<table>
  <thead>
    <tr>
      <th>Ticker</th>
      <th>Score</th>
      <th>RSI</th>
      <th>Reasons</th>
    </tr>
  </thead>
  <tbody id="sellTable"></tbody>
</table>

<h3>📊 All Stocks</h3>
<table>
  <thead>
    <tr>
      <th>Ticker</th>
      <th>Price</th>
      <th>RSI</th>
      <th>Score</th>
      <th>Recommendation</th>
      <th>Reasons</th>
    </tr>
  </thead>
  <tbody id="allTable"></tbody>
</table>

<script>

async function loadData() {
  const res = await fetch("./data.json?t=" + Date.now());
  const data = await res.json();

  const buy = data.filter(d => d.ai_score >= 1).sort((a,b)=>b.ai_score-a.ai_score);
  const sell = data.filter(d => d.ai_score <= -1).sort((a,b)=>a.ai_score-b.ai_score);

  document.getElementById("buyTable").innerHTML =
    buy.slice(0,5).map(d => `
      <tr>
        <td>${d.ticker}</td>
        <td class="buy">${d.ai_score}</td>
        <td>${d.rsi}</td>
        <td>${d.reasons.join(", ")}</td>
      </tr>
    `).join("");

  document.getElementById("sellTable").innerHTML =
    sell.slice(0,5).map(d => `
      <tr>
        <td>${d.ticker}</td>
        <td class="sell">${d.ai_score}</td>
        <td>${d.rsi}</td>
        <td>${d.reasons.join(", ")}</td>
      </tr>
    `).join("");

  document.getElementById("allTable").innerHTML =
    data.map(d => `
      <tr>
        <td>${d.ticker}</td>
        <td>${d.current}</td>
        <td>${d.rsi}</td>
        <td>${d.ai_score}</td>
        <td class="${d.recommendation.includes('BUY') ? 'buy' : d.recommendation.includes('SELL') ? 'sell' : 'hold'}">
          ${d.recommendation}
        </td>
        <td>${d.reasons.join(", ")}</td>
      </tr>
    `).join("");
}

loadData();
setInterval(loadData, 300000);

</script>

</body>
</html>
