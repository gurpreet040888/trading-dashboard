<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fund Holdings · MF Tracker India</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --surface2: #f1f3f6;
    --border: #e3e6eb;
    --text: #2b2f38;
    --text-muted: #6b7280;
    --accent: #b3781f;
    --accent2: #3b6ea5;
    --green: #2f9e6f;
    --red: #c2453f;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    --font-sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 13px; line-height: 1.5; }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .back-btn {
    color: var(--accent2);
    text-decoration: none;
    font-size: 13px;
    padding: 5px 12px;
    border: 1px solid rgba(59,110,165,0.3);
    border-radius: 6px;
    white-space: nowrap;
  }
  .back-btn:hover { background: rgba(59,110,165,0.08); }
  .header-title { font-size: 15px; font-weight: 700; color: var(--text); }

  .page { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

  .fund-hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px 24px;
    margin-bottom: 24px;
  }
  .fund-hero h1 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .fund-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 16px;
  }
  .meta-item { font-size: 12px; color: var(--text-muted); }
  .meta-item b { color: var(--text); font-weight: 600; }
  .fund-stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }
  .stat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: center;
  }
  .stat-val { font-size: 16px; font-weight: 700; font-family: var(--font-mono); }
  .stat-lbl { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
  @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .card h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }

  /* Holdings Table */
  .holdings-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
  .holdings-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  .holdings-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .holdings-table tr:last-child td { border-bottom: none; }
  .holdings-table tr:hover td { background: var(--surface2); }
  .bar-wrap { display: flex; align-items: center; gap: 8px; }
  .bar { height: 6px; border-radius: 3px; background: var(--accent); min-width: 2px; }

  /* Allocation bars */
  .alloc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .alloc-label { width: 120px; font-size: 12px; flex-shrink: 0; }
  .alloc-bar-wrap { flex: 1; background: var(--surface2); border-radius: 4px; height: 10px; overflow: hidden; }
  .alloc-bar { height: 100%; border-radius: 4px; }
  .alloc-pct { width: 45px; text-align: right; font-size: 12px; font-family: var(--font-mono); font-weight: 600; flex-shrink: 0; }

  .loading { text-align: center; padding: 60px; color: var(--text-muted); }
  .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { text-align: center; padding: 60px; color: var(--red); }

  .sector-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; flex-shrink: 0; }

  /* Donut chart */
  .donut-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .donut-legend { flex: 1; min-width: 140px; }
  .legend-row { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; font-size: 11px; }
  .legend-name { flex: 1; color: var(--text-muted); }
  .legend-pct { font-weight: 700; font-family: var(--font-mono); color: var(--text); }

  .note { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="funds.html">← Back to All Funds</a>
  <div class="header-title" id="headerTitle">Loading…</div>
</div>

<div class="page">
  <div id="loadingEl" class="loading">
    <div><div class="spinner"></div></div>
    <div>Fetching fund details…</div>
  </div>
  <div id="mainContent" style="display:none"></div>
</div>

<script>
const COLORS = [
  '#f0b429','#58a6ff','#3fb950','#f85149','#a371f7',
  '#fb8500','#06d6a0','#ef476f','#ffd166','#118ab2',
  '#e76f51','#2ec4b6','#c77dff','#90be6d','#f9c74f'
];

function getParams() {
  const p = new URLSearchParams(window.location.search);
  return { code: p.get('code') };
}

async function load() {
  const { code } = getParams();
  if (!code) { showError('No fund code provided.'); return; }

  try {
    // Fetch NAV + meta
    const r1 = await fetch(`https://api.mfapi.in/mf/${code}`);
    if (!r1.ok) throw new Error('Fund not found');
    const data = await r1.json();

    const meta = data.meta || {};
    const navList = data.data || [];
    const nav = navList[0] ? parseFloat(navList[0].nav) : null;
    const navDate = navList[0]?.date || '';

    document.getElementById('headerTitle').textContent = meta.scheme_name || 'Fund Detail';
    document.title = (meta.scheme_name || 'Fund') + ' · MF Tracker';

    // Build returns
    const returns = calcReturns(navList);

    let html = buildHero(meta, nav, navDate, navList.length, returns);

    // Try to fetch holdings
    let holdingsHtml = '';
    try {
      const r2 = await fetch(`https://api.mfapi.in/mf/${code}/holdings`);
      if (r2.ok) {
        const hData = await r2.json();
        const holdings = hData.data || hData.holdings || [];
        if (holdings.length > 0) {
          holdingsHtml = buildHoldings(holdings);
        } else {
          holdingsHtml = noHoldingsMsg();
        }
      } else {
        holdingsHtml = noHoldingsMsg();
      }
    } catch {
      holdingsHtml = noHoldingsMsg();
    }

    html += holdingsHtml;

    document.getElementById('mainContent').innerHTML = html;
    document.getElementById('loadingEl').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';

    // Draw donut after DOM insertion
    drawDonut();

  } catch(e) {
    showError(e.message);
  }
}

function calcReturns(navList) {
  if (!navList.length) return {};
  const latest = parseFloat(navList[0].nav);
  const now = new Date();
  const periods = { '1M': 30, '3M': 91, '6M': 182, '1Y': 365, '2Y': 730, '3Y': 1095, '5Y': 1825 };
  const result = {};
  for (const [k, days] of Object.entries(periods)) {
    const target = new Date(now - days * 86400000);
    for (const entry of navList) {
      const d = parseDate(entry.date);
      if (d && d <= target) {
        const past = parseFloat(entry.nav);
        if (past > 0) {
          const yrs = days / 365;
          let ret = ((latest - past) / past) * 100;
          if (yrs > 1) ret = (Math.pow(latest / past, 1 / yrs) - 1) * 100;
          result[k] = ret.toFixed(2);
        }
        break;
      }
    }
  }
  return result;
}

function parseDate(s) {
  if (!s) return null;
  const p = s.split('-');
  if (p.length !== 3) return null;
  return new Date(+p[2], +p[1] - 1, +p[0]);
}

function buildHero(meta, nav, navDate, dataPoints, returns) {
  const retHtml = Object.entries(returns).map(([k, v]) => {
    const n = parseFloat(v);
    const cls = n >= 0 ? 'pos' : 'neg';
    return `<div class="stat-box"><div class="stat-val ${cls}">${n >= 0 ? '+' : ''}${n.toFixed(2)}%</div><div class="stat-lbl">${k} Return</div></div>`;
  }).join('');

  return `
  <div class="fund-hero">
    <h1>${esc(meta.scheme_name || 'Unknown Fund')}</h1>
    <div class="fund-meta">
      <div class="meta-item">AMC: <b>${esc(meta.fund_house || '—')}</b></div>
      <div class="meta-item">Type: <b>${esc(meta.scheme_type || '—')}</b></div>
      <div class="meta-item">Category: <b>${esc(meta.scheme_category || '—')}</b></div>
      <div class="meta-item">ISIN (Growth): <b style="font-family:var(--font-mono)">${esc(meta.isin_growth || '—')}</b></div>
      <div class="meta-item">NAV Date: <b>${esc(navDate)}</b></div>
      <div class="meta-item">History: <b>${dataPoints} days</b></div>
    </div>
    <div style="margin-bottom:12px">
      <div class="stat-box" style="display:inline-block;min-width:160px">
        <div class="stat-val" style="color:var(--accent)">₹${nav?.toFixed(4) ?? '—'}</div>
        <div class="stat-lbl">Current NAV</div>
      </div>
    </div>
    <div class="fund-stats">${retHtml}</div>
  </div>`;
}

function buildHoldings(holdings) {
  // Normalize fields
  const items = holdings.map(h => ({
    name: h.company_name || h.name || h.instrumentName || '—',
    sector: h.sector_name || h.sector || h.sectorName || '—',
    pct: parseFloat(h.percentage || h.percentage_to_net_assets || h.percentageOfAssets || 0),
    value: h.value || h.marketValue || null,
    assetType: h.asset_type || h.assetType || null,
  })).filter(h => h.pct > 0);

  // Sort by pct desc
  items.sort((a, b) => b.pct - a.pct);
  const maxPct = items[0]?.pct || 1;

  // Sector allocation
  const sectorMap = {};
  items.forEach(h => {
    const s = h.sector || 'Others';
    sectorMap[s] = (sectorMap[s] || 0) + h.pct;
  });
  const sectors = Object.entries(sectorMap).sort((a,b) => b[1]-a[1]);

  // Asset type allocation
  const assetMap = {};
  items.forEach(h => {
    const a = h.assetType || 'Equity';
    assetMap[a] = (assetMap[a] || 0) + h.pct;
  });
  const assetTypes = Object.entries(assetMap).sort((a,b) => b[1]-a[1]);

  const topHoldings = items.slice(0, 25);

  let html = `
  <div class="grid-2">
    <div class="card">
      <h3>Sector Allocation</h3>
      <div id="donutWrap" class="donut-wrap">
        <canvas id="donutCanvas" width="140" height="140" style="flex-shrink:0"></canvas>
        <div class="donut-legend" id="donutLegend"></div>
      </div>
      <script>window._sectors=${JSON.stringify(sectors)}<\/script>
    </div>
    <div class="card">
      <h3>Asset Allocation</h3>
      ${assetTypes.map((([name, pct], i) => {
        return `<div class="alloc-row">
          <div class="alloc-label">${esc(name)}</div>
          <div class="alloc-bar-wrap"><div class="alloc-bar" style="width:${pct}%;background:${COLORS[i % COLORS.length]}"></div></div>
          <div class="alloc-pct">${pct.toFixed(1)}%</div>
        </div>`;
      })).join('')}
    </div>
  </div>

  <div class="card" style="margin-bottom:24px">
    <h3>Top Holdings (${topHoldings.length} of ${items.length})</h3>
    <table class="holdings-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Company / Instrument</th>
          <th>Sector</th>
          <th style="text-align:right">% of Portfolio</th>
        </tr>
      </thead>
      <tbody>
        ${topHoldings.map((h, i) => `
          <tr>
            <td style="color:var(--text-muted)">${i+1}</td>
            <td>${esc(h.name)}</td>
            <td style="color:var(--text-muted)">${esc(h.sector)}</td>
            <td style="text-align:right">
              <div class="bar-wrap" style="justify-content:flex-end">
                <div class="bar" style="width:${Math.round(h.pct/maxPct*80)}px"></div>
                <span style="font-family:var(--font-mono);font-weight:700">${h.pct.toFixed(2)}%</span>
              </div>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
    <p class="note">⚠️ Holdings data is as declared by the AMC and may be 1 month delayed per SEBI norms.</p>
  </div>`;

  return html;
}

function noHoldingsMsg() {
  return `
  <div class="card" style="margin-bottom:24px;text-align:center;padding:40px">
    <div style="font-size:32px;margin-bottom:12px">📋</div>
    <div style="color:var(--text-muted);font-size:13px">Holdings data not available for this fund via MF API.<br>
    Check the AMC website or <a href="https://www.amfiindia.com" target="_blank" style="color:var(--accent2)">AMFI India</a> for portfolio disclosure.</div>
  </div>`;
}

function drawDonut() {
  const sectors = window._sectors;
  if (!sectors || !sectors.length) return;
  const canvas = document.getElementById('donutCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const cx = 70, cy = 70, R = 60, r = 35;
  const total = sectors.reduce((s, [, v]) => s + v, 0);
  let angle = -Math.PI / 2;

  sectors.slice(0, 10).forEach(([name, val], i) => {
    const slice = (val / total) * 2 * Math.PI;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, R, angle, angle + slice);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();
    // donut hole
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    angle += slice;
  });

  // Legend
  const legend = document.getElementById('donutLegend');
  if (legend) {
    legend.innerHTML = sectors.slice(0, 10).map(([name, val], i) =>
      `<div class="legend-row">
        <span class="sector-dot" style="background:${COLORS[i]}"></span>
        <span class="legend-name">${esc(name)}</span>
        <span class="legend-pct">${val.toFixed(1)}%</span>
      </div>`
    ).join('');
  }
}

function showError(msg) {
  document.getElementById('loadingEl').innerHTML = `<div class="error">⚠️ ${esc(msg)}</div>`;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

load();
</script>
</body>
</html>
